<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C189" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#9E7C3B" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E1F14" />
      <stop offset="100%" stop-color="#1A110B" />
    </linearGradient>
  </defs>

  <!-- Background Shield/Badge -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />

  <!-- Shopping Bag Outline -->
  <path d="M160 180 L160 400 Q160 420 180 420 L332 420 Q352 420 352 400 L352 180 Z" 
        fill="none" stroke="url(#goldGradient)" stroke-width="20" stroke-linejoin="round" />
  <path d="M206 180 Q206 120 256 120 Q306 120 306 180" 
        fill="none" stroke="url(#goldGradient)" stroke-width="20" stroke-linecap="round" />

  <!-- JMS Stylized Monogram -->
  <text x="256" y="325" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="110" 
        font-weight="bold" 
        fill="url(#goldGradient)" 
        text-anchor="middle" 
        letter-spacing="2">JMS</text>
</svg>
